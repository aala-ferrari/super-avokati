<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>Hyr — Super Avokati</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0a0a'/%3E%3Cpath d='M32 14v36M14 22h36M8 22l-4 10h8zM56 22l-4 10h8zM26 50h12v4H26z' stroke='%23e41e26' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='14' r='3' fill='%23c9a24d'/%3E%3C/svg%3E" />
</head>
<body class="login-page">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="icon-scales" viewBox="0 0 80 80">
      <g class="scales-pillar">
        <line x1="40" y1="14" x2="40" y2="66" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <rect x="28" y="64" width="24" height="5" rx="1.5" fill="currentColor"/>
        <circle cx="40" cy="12" r="3.5" fill="#c9a24d"/>
      </g>
      <line x1="12" y1="22" x2="68" y2="22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <g class="scales-pan scales-pan-left">
        <line x1="12" y1="22" x2="12" y2="30" stroke="currentColor" stroke-width="1.5"/>
        <path d="M 4 32 Q 12 42 20 32 Z" fill="currentColor" opacity="0.92"/>
      </g>
      <g class="scales-pan scales-pan-right">
        <line x1="68" y1="22" x2="68" y2="30" stroke="currentColor" stroke-width="1.5"/>
        <path d="M 60 32 Q 68 42 76 32 Z" fill="currentColor" opacity="0.92"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="login-wrap">
  <div class="login-card">
    <div class="logo login-logo">
      <svg class="logo-svg" viewBox="0 0 80 80" aria-hidden="true"><use href="#icon-scales"/></svg>
      <div class="logo-glow" aria-hidden="true"></div>
    </div>
    <h1>Super Avokati</h1>
    <p class="login-tagline">Beteja fitohet para se të nisë.</p>

    <form id="login-form" class="login-form" autocomplete="on">
      <label>
        <span>Përdoruesi</span>
        <input type="text" id="login-username" name="username"
               autocomplete="username" autocapitalize="none"
               required autofocus />
      </label>
      <label>
        <span>Fjalëkalimi</span>
        <input type="password" id="login-password" name="password"
               autocomplete="current-password" required />
      </label>
      <button type="submit" id="login-btn" class="primary">Hyr</button>
      <div id="login-error" class="login-error" hidden></div>
    </form>

    <div class="login-footer">
      💙 <strong>Informacion ligjor falas.</strong> Aksesi është i rezervuar —
      kontakto administratorin nëse nuk ke kredenciale.
    </div>
  </div>
</div>

<script src="/static/login.js"></script>
</body>
</html>
