<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Në seancë — {{ case.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #1a1622;
    --surface-2: #232030;
    --border: #3a2f47;
    --gold: #c9a24d;
    --text: #f3eee0;
    --muted: #b0a8c4;
    --danger: #ff6b6b;
    --ok: #6bcf6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  .hh-header {
    position: sticky; top: 0; z-index: 10;
    padding: env(safe-area-inset-top) 14px 10px;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .hh-header h1 {
    margin: 0; font-size: 17px; font-weight: 600; color: var(--gold);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  .hh-header .hh-close {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 8px 14px; border-radius: 8px;
    font-size: 14px; text-decoration: none;
  }

  .hh-feed {
    flex: 1;
    padding: 14px;
    padding-bottom: 200px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .hh-empty {
    text-align: center; color: var(--muted); padding: 40px 20px;
    font-style: italic;
  }
  .hh-bubble {
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    word-break: break-word;
    line-height: 1.5;
    font-size: 17px;
  }
  .hh-bubble .hh-meta {
    font-size: 11px; color: var(--muted);
    margin-bottom: 4px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .hh-bubble .hh-del {
    background: transparent; border: 0; color: var(--muted);
    font-size: 16px; cursor: pointer; padding: 0 4px;
  }
  .hh-question { background: rgba(201,162,77,0.12); border-color: var(--gold); }
  .hh-question .hh-meta { color: var(--gold); }
  .hh-ai {
    background: linear-gradient(135deg, #1d1825, #2a2230);
    border-color: var(--gold);
    align-self: stretch;
  }
  .hh-ai .hh-meta { color: var(--gold); }
  .hh-note { background: var(--surface); }

  .hh-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 0) + 12px);
    background: rgba(10,10,10,0.96);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px; z-index: 20;
  }

  .hh-input-row {
    display: flex; gap: 8px; align-items: stretch;
  }
  .hh-input {
    flex: 1; resize: none; min-height: 50px; max-height: 140px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 17px;
    line-height: 1.4;
  }
  .hh-input:focus { outline: 2px solid var(--gold); outline-offset: 0; }

  .hh-mic {
    width: 56px; height: 56px;
    border: 1px solid var(--border); border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .hh-mic.listening {
    background: var(--gold); border-color: var(--gold); color: #0a0a0a;
    animation: hhPulse 1.2s ease-in-out infinite;
  }
  .hh-mic[disabled] { opacity: 0.4; cursor: not-allowed; }
  @keyframes hhPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201,162,77,0.7); }
    50% { box-shadow: 0 0 0 12px rgba(201,162,77,0); }
  }

  .hh-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .hh-actions button {
    padding: 12px 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 10px;
    font-size: 14px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    min-height: 48px;
    transition: background 0.15s;
  }
  .hh-actions button:hover { background: var(--surface-2); }
  .hh-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hh-btn-ask { background: var(--gold) !important; color: #0a0a0a !important; border-color: var(--gold) !important; }
  .hh-btn-ask:hover { filter: brightness(1.1); }

  .hh-status {
    text-align: center; font-size: 12px; color: var(--muted);
    min-height: 16px;
  }
  .hh-status.error { color: var(--danger); }
  .hh-status.ok { color: var(--ok); }

  /* Light mode (rare in court but supported) */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbf8f2; --surface: #fff; --surface-2: #f3ece0;
      --border: #d6cfc1; --gold: #8a6914; --text: #2a1f12; --muted: #6b5d44;
    }
    .hh-question { background: rgba(138,105,20,0.08); }
    .hh-ai { background: linear-gradient(135deg, #fffbf2, #f7f0d9); }
  }
</style>
</head>
<body data-case-id="{{ case.id }}">

<header class="hh-header">
  <h1>⚖️ {{ case.title }}</h1>
  <a href="/" class="hh-close">✕ Dil</a>
</header>

<main id="hh-feed" class="hh-feed" aria-live="polite">
  <p class="hh-empty">Duke ngarkuar…</p>
</main>

<div class="hh-bar">
  <div class="hh-input-row">
    <textarea id="hh-input" class="hh-input" rows="1" placeholder="Shkruaj ose dikto…" enterkeyhint="send"></textarea>
    <button type="button" id="hh-mic" class="hh-mic" title="Mikrofon (sq-AL)">🎤</button>
  </div>
  <div class="hh-actions">
    <button type="button" id="hh-note">📝 Shëno</button>
    <button type="button" id="hh-ask" class="hh-btn-ask">⚡ Pyet AI</button>
    <button type="button" id="hh-clear">🧹 Pastro</button>
  </div>
  <div id="hh-status" class="hh-status"></div>
</div>
  <script src="/static/in_hearing.js?v=1" defer></script>
</body>
</html>
